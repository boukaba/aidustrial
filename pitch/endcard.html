<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --ink:#0f2350; --muted:#7b869c; --blue:#1a73ff; --paper:#080c11;
    --display:'Space Grotesk',-apple-system,'Helvetica Neue',Arial,sans-serif;
    --body:'Inter',-apple-system,'Helvetica Neue',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1920px;height:1080px;background:var(--paper);overflow:hidden}
  .wrap{
    position:relative;width:1920px;height:1080px;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:0;
    background-image:
      linear-gradient(rgba(45,212,191,.05) 1px,transparent 1px),
      linear-gradient(90deg,rgba(45,212,191,.05) 1px,transparent 1px);
    background-size:64px 64px;
  }
  .glow{
    position:absolute;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(26,115,255,.16),rgba(26,115,255,0) 68%);
  }
  img{width:520px;display:block;position:relative}
  .line{
    position:relative;margin-top:52px;font-family:var(--display);font-size:34px;
    font-weight:500;color:#e8eef6;letter-spacing:-.02em;text-align:center;line-height:1.35;
  }
  .line span{color:#2dd4bf}
  .rule{position:relative;width:180px;height:1px;background:rgba(255,255,255,.14);margin:54px 0 34px}
  .meta{
    position:relative;text-align:center;font-family:var(--body);font-size:22px;
    color:#8ba0b0;line-height:1.7;font-weight:300;
  }
  .meta b{color:#cfdae4;font-weight:500}
  .mail{color:#38bdf8;text-decoration:none}
  .rights{margin-top:10px;font-size:18px;color:#5c7180;letter-spacing:.02em}
</style>
</head>
<body>
  <div class="wrap">
    <div class="glow"></div>
    <img src="file:///Users/YACINE/aidustrial/aidustrial_logo_light.png" alt="Aidustrial" />
    <div class="line">The AI Agents do the watching and the reasoning.<br/><span>The human keeps the authority.</span></div>
    <div class="rule"></div>
    <div class="meta">
      <b>Mohammed Boukaba</b> · Creator<br/>
      <a class="mail" href="mailto:mohammed@pullrun.dev">mohammed@pullrun.dev</a>
      <div class="rights">© 2026 Mohammed Boukaba. All rights reserved.</div>
    </div>
  </div>
</body>
</html>
