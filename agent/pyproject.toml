[project]
name = "aidustrial"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "langchain-core>=0.3", "fastapi>=0.115", "uvicorn>=0.32", "pydantic>=2.9"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aidustrial"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
